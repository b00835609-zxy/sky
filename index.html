<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Passport</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
:root{--bg:#eef5ff;--ink:#0b2a4a;--card:#fff;--mut:#4d6580;--y:#0b2a4a;--yt:#fff;--blue:#1f78d1;--nav:#0b2a4a;--h1:#8ec8ff;--h2:#dcecff;--bad:#e5484d;--ok:#12a36b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1830;--ink:#e8f1ff;--card:#13284a;--mut:#9db3d4;--y:#5aaeff;--yt:#06142a;--blue:#5aaeff;--nav:#06142a;--h1:#1b3d6e;--h2:#12294d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1830;--ink:#e8f1ff;--card:#13284a;--mut:#9db3d4;--y:#5aaeff;--yt:#06142a;--blue:#5aaeff;--nav:#06142a;--h1:#1b3d6e;--h2:#12294d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nav);z-index:10}
h1,h2,h3,.big,.logo{font-family:"Baloo 2","PingFang SC","Microsoft YaHei",sans-serif;font-weight:800;line-height:1.2;margin:.2em 0}
h1{font-size:clamp(1.9rem,7.5vw,3rem)}h3{font-size:1.2rem}p{margin:.4em 0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);color:#fff;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;padding:10px 16px 16px}
header::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:3px;background:repeating-linear-gradient(90deg,#fff 0 18px,transparent 18px 34px)}
header a{color:#fff;font-weight:700;text-decoration:none;margin-right:14px}.logo{font-size:1.3rem;margin:0}
header nav{display:flex;align-items:center}header nav a:nth-child(2){margin-right:10px}
select{font:inherit;border:2px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:.15em .6em}option{color:#000}
main{max-width:920px;margin:0 auto;padding:20px 16px 40px}
a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.lead{color:var(--mut);max-width:34em}
.hero{background:linear-gradient(var(--h1),var(--h2));border:2px solid var(--ink);border-radius:24px;padding:22px 18px;position:relative;overflow:hidden;margin-bottom:26px}
.hero::before{content:"";position:absolute;right:-20px;top:16px;width:150px;height:44px;background:#fff;border-radius:44px;opacity:.7;box-shadow:-60px 28px 0 -6px #fff,40px 34px 0 -10px #fff}
.hero>*{position:relative}
.route{display:flex;align-items:center;margin:18px 0 6px}
.wp{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:var(--card);display:grid;place-items:center;font-weight:800;flex:none}
.wp.on{background:var(--blue);color:#fff}.wp.now{background:var(--ink);color:var(--bg)}
.route i{flex:1;max-width:70px;border-top:3px dashed var(--ink)}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
.band{position:relative;background:var(--t);color:#fff;font-weight:800;padding:10px 16px;border-bottom:2px dashed var(--ink);display:flex;justify-content:space-between}
.band::before,.band::after{content:"";position:absolute;bottom:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.band::before{left:-12px}.band::after{right:-12px}
.card .body{padding:16px 16px 12px}.card p{color:var(--mut);font-size:.95rem}
.bc{height:20px;margin-top:14px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px 6px,transparent 6px 10px)}
.soon{border-style:dashed;box-shadow:none;padding:18px;text-align:center;color:var(--mut)}
.bar{height:10px;border:2px solid var(--ink);border-radius:9px;margin:12px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--t)}
.btn{font:inherit;font-weight:800;border:2px solid var(--ink);background:var(--y);color:var(--yt);border-radius:999px;padding:.5em 1.2em;cursor:pointer;display:inline-block;text-decoration:none}
.btn:active{transform:translateY(2px)}.alt{background:var(--card);color:var(--ink)}
.back{color:var(--mut);text-decoration:none;font-weight:700}
.lh{display:flex;gap:16px;align-items:center;margin:14px 0}.lh .big{font-size:2.4rem;color:#fff;background:var(--t);border:2px solid var(--ink);border-radius:50%;width:80px;height:80px;display:grid;place-items:center;flex:none}
.tabs,.lvs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.tb,.lv{font:inherit;font-weight:700;white-space:nowrap;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:.35em 1em;cursor:pointer}
.tb.on,.lv.on{background:var(--ink);color:var(--bg)}
.st{background:var(--card);border:2px solid var(--ink);border-radius:16px}
#stage{padding:18px;margin-top:6px}
.rc{list-style:none;padding:0;display:grid;gap:14px}.rc li{padding:14px 18px;border-left:10px solid var(--t)}.rc p{color:var(--mut)}
.q{font-size:1.15rem;font-weight:700}.opts{display:grid;gap:10px;margin:12px 0}
.opt,.chip,.bucket{font:inherit;text-align:left;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:14px;padding:.6em 1em;cursor:pointer}
.opt.ok,.chip.on{background:var(--ok);color:#fff}.opt:disabled{opacity:.7}
.no{animation:sh .3s;background:var(--bad)!important;color:#fff!important}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.chip{border-radius:999px}
.bk{display:grid;gap:10px}.bucket{display:flex;flex-direction:column;min-height:64px;border-style:dashed}.bucket span{color:var(--ok);font-weight:700}
.seq{padding-left:1.4em}.seq li{font-weight:700;color:var(--ok)}
.fb{min-height:1.6em;font-weight:700}.res{text-align:center}.res .big{font-size:2.6rem;color:var(--blue)}.off{opacity:.25}
.links{list-style:none;padding:0;display:grid;gap:12px}.links a{display:block;padding:12px 18px;color:var(--ink);font-weight:700;text-decoration:none}
pre{padding:16px;overflow-x:auto;font-size:.85rem;line-height:1.5}
.field{position:relative;height:260px;border:2px solid var(--ink);border-radius:14px;margin:10px 0;overflow:hidden;background:linear-gradient(var(--h1),var(--h2))}
.field::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(90deg,var(--ink) 0 20px,transparent 20px 36px)}
.fall{position:absolute;top:0;left:8px;right:8px;padding:.5em .8em;border:2px solid var(--ink);border-radius:12px;background:var(--card);font-weight:700}
.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lanes .opt{text-align:center;font-weight:800;padding:.8em .2em}
.mg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.mc{font:inherit;font-weight:700;min-height:78px;border:2px solid var(--ink);border-radius:14px;background:var(--y);color:var(--yt);font-size:1.5rem;cursor:pointer;padding:.4em}
.mc.up,.mc.ok{font-size:.95rem}.mc.up{background:var(--card);color:var(--ink)}.mc.ok{background:var(--ok);color:#fff}
@media(min-width:700px){.mg{grid-template-columns:repeat(4,1fr)}}
@media(min-width:700px){.bk{grid-template-columns:repeat(3,1fr)}.opts.two{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){.no{animation:none}}
</style>
</head>

let P={};try{P=JSON.parse(localStorage.getItem("lp")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("lp",JSON.stringify(P))}catch(e){}};
const K=L=>[...L.games.map((_,i)=>L.id+":g"+i),L.id+":q"];
const done=L=>K(L).filter(k=>P[k]).length,full=L=>done(L)===K(L).length;
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let tab="recap",lv=0,cur=null;const E={};

function hdr(){document.documentElement.lang=HL[lang];document.title=t("app");
 $("#hd").innerHTML=`<a class="logo" href="#">✈ ${t("app")}</a><nav><a href="#">${t("nl")}</a><a href="#about">${t("ab")}</a><select id="lg" aria-label="${t("lang")}">${[["en","English"],["zh","中文"],["fr","Français"]].map(([k,n])=>`<option value="${k}"${k===lang?" selected":""}>${n}</option>`).join("")}</select></nav>`}
function result(el,key,m){const s=m===0?3:m<3?2:1;P[key]=Math.max(P[key]||0,s);save();
 el.innerHTML=`<div class="res"><div class="big" aria-hidden="true">${"✈".repeat(s)}<span class="off">${"✈".repeat(3-s)}</span></div><h3>${t("r")[s]}</h3><p>${t("miss",m)}</p><button class="btn alt" data-again>${t("again")}</button> <button class="btn" data-next>${t("nxt")}</button></div>`}
E.choose=(g,key,el)=>{let i=0,m=0,fresh=true;
 const show=()=>{const q=g.qs[i],os=q.o.map(tx);fresh=true;
  el.innerHTML=`<h3>${tx(g.title)}</h3><p>${t("qn",i+1,g.qs.length)}</p><p class="q">${tx(q.q)}</p><div class="opts${os.every(o=>o.length<16)?" two":""}">${os.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}</div><p class="fb"></p>`};
 el.onclick=e=>{const b=e.target.closest(".opt");
  if(b&&!b.disabled){const q=g.qs[i],fb=el.querySelector(".fb");
   if(+b.dataset.j===q.a){b.classList.add("ok");el.querySelectorAll(".opt").forEach(x=>x.disabled=true);fb.innerHTML=`✓ ${tx(q.w)}<br><button class="btn" id="nx">${t(i+1<g.qs.length?"nx":"fin")}</button>`}
   else{if(fresh)m++;fresh=false;b.classList.add("no");b.disabled=true;fb.textContent=t("wrong")}}
  if(e.target.id==="nx"){i++;i<g.qs.length?show():result(el,key,m)}};
 show()};
E.sort=(g,key,el)=>{let m=0,sel=null,left=sh(g.items.map((_,i)=>i));const pl=g.buckets.map(()=>[]);
 const draw=()=>{if(!left.length)return result(el,key,m);
  el.innerHTML=`<h3>${tx(g.title)}</h3><p>${t("pick")}</p><div class="chips">${left.map(i=>`<button class="chip${sel===i?" on":""}" data-i="${i}">${g.items[i][0]}</button>`).join("")}</div><div class="bk">${g.buckets.map((b,j)=>`<button class="bucket" data-b="${j}"><b>${tx(b)}</b><span>${pl[j].map(i=>g.items[i][0]).join(", ")}</span></button>`).join("")}</div>`};
 el.onclick=e=>{const c=e.target.closest(".chip"),b=e.target.closest(".bucket");
  if(c){sel=+c.dataset.i;draw()}
  else if(b&&sel!==null){const j=+b.dataset.b;
   if(g.items[sel][1]===j){pl[j].push(sel);left=left.filter(x=>x!==sel);sel=null;draw()}
   else{m++;b.classList.add("no");setTimeout(()=>b.classList.remove("no"),400)}}};
 draw()};
E.order=(g,key,el)=>{let m=0,n=0;const pool=sh(g.steps.map((_,i)=>i));
 const draw=()=>{if(n===g.steps.length)return result(el,key,m);
  el.innerHTML=`<h3>${tx(g.title)}</h3><p>${t("ord")}</p><ol class="seq">${g.steps.slice(0,n).map(s=>`<li>${tx(s)}</li>`).join("")}</ol><div class="chips">${pool.filter(i=>i>=n).map(i=>`<button class="chip" data-i="${i}">${tx(g.steps[i])}</button>`).join("")}</div>`};
 el.onclick=e=>{const c=e.target.closest(".chip");if(!c)return;
  if(+c.dataset.i===n){n++;draw()}else{m++;c.classList.add("no");setTimeout(()=>c.classList.remove("no"),400)}};
 draw()};

E.dispatch=(g,key,el)=>{let i=0,m=0,lives=3,raf=0,t0=0;
 const miss=()=>{m++;lives--;i++;next()};
 const next=()=>{cancelAnimationFrame(raf);if(i>=g.items.length||lives<1)return result(el,key,m);
  const it=g.items[i],d=Math.max(3500,7000-400*i);
  el.innerHTML=`<h3>${tx(g.title)}</h3><p>${t("dis")} <b>${"♥".repeat(lives)}</b><span class="off">${"♥".repeat(3-lives)}</span></p><div class="field"><div class="fall">✈ ${tx(it[0])}</div></div><div class="lanes">${g.lanes.map((n,j)=>`<button class="opt" data-j="${j}">${n}</button>`).join("")}</div>`;
  const f=el.querySelector(".fall");t0=performance.now();
  const tick=n=>{if(!f.isConnected)return;const p=Math.min(1,(n-t0)/d);f.style.top=p*68+"%";if(p<1)raf=requestAnimationFrame(tick);else miss()};
  raf=requestAnimationFrame(tick)};
 el.onclick=e=>{const b=e.target.closest(".lanes .opt");if(!b)return;cancelAnimationFrame(raf);if(+b.dataset.j===g.items[i][1]){i++;next()}else miss()};
 next()};
E.match=(g,key,el)=>{let m=0,a=-1,lock=false;const cs=sh(g.pairs.flatMap((p,i)=>[[i,p[0]],[i,p[1]]])),ok=new Set,op=new Set;
 const draw=()=>{if(ok.size===cs.length)return result(el,key,m>>1);
  el.innerHTML=`<h3>${tx(g.title)}</h3><p>${t("mat")}</p><div class="mg">${cs.map((c,k)=>`<button class="mc${ok.has(k)?" ok":op.has(k)?" up":""}" data-k="${k}">${ok.has(k)||op.has(k)?tx(c[1]):"✈"}</button>`).join("")}</div>`};
 el.onclick=e=>{const b=e.target.closest(".mc");if(!b||lock)return;const k=+b.dataset.k;if(ok.has(k)||op.has(k))return;
  op.add(k);
  if(a<0){a=k;draw()}
  else if(cs[a][0]===cs[k][0]){ok.add(a);ok.add(k);op.clear();a=-1;draw()}
  else{m++;lock=true;draw();setTimeout(()=>{op.clear();a=-1;lock=false;draw()},900)}};
 draw()};
E.clear=(g,key,el)=>{let i=0,m=0,fb="";
 const draw=()=>{if(i>=g.items.length)return result(el,key,m>>1);
  el.innerHTML=`<h3>${tx(g.title)}</h3><p>${t("clr")}</p><p class="fb">${fb}</p><div class="st" style="padding:18px;font-weight:700;font-size:1.15rem">✈ ${tx(g.items[i].s)}</div><div class="lanes" style="grid-template-columns:1fr 1fr;margin-top:12px"><button class="btn" data-v="1">${t("yes")}</button><button class="btn alt" data-v="0">${t("nope")}</button></div><p>${i+1} / ${g.items.length}</p>`};
 el.onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;const it=g.items[i],ok=(b.dataset.v==="1")===it.a;
  if(!ok)m++;fb=ok?"✓":"✗ "+t(it.a?"tru":"fls");i++;draw()};
 draw()};
function card(l){return`<a class="card" href="#${l.id}" style="--t:${l.color}"><div class="band"><span>✈ ${t("flt",l.n)}</span><span>LL0${l.n}</span></div><div class="body"><h3>${tx(l.title)}</h3><p>${tx(l.sub)}</p><div class="bar"><i style="width:${done(l)/K(l).length*100}%"></i></div><span class="btn">${full(l)?t("again"):done(l)?t("cont"):t("start")}</span><div class="bc"></div></div></a>`}
function homeView(){cur=null;const got=LESSONS.filter(full).length;let now=false;
 const nodes=LESSONS.map(l=>{if(full(l))return`<span class="wp on">✓</span>`;if(!now){now=true;return`<span class="wp now">✈</span>`}return`<span class="wp">${l.n}</span>`}).join("<i></i>");
 app.innerHTML=`<section class="hero"><h1>${t("h")}</h1><p class="lead">${t("lead")}</p><div class="route" role="img" aria-label="${t("legs",got,LESSONS.length)}">${nodes}<i></i><span class="wp">＋</span></div><p><b>${t("legs",got,LESSONS.length)}</b></p></section>
 <div class="grid">${LESSONS.map(card).join("")}<div class="card soon"><div class="big">＋</div><b>${t("soon")}</b><p>${t("soond")}</p></div></div>`}
function lessonView(L){cur=L;
 app.innerHTML=`<a class="back" href="#">${t("back")}</a><div class="lh" style="--t:${L.color}"><span class="big" aria-hidden="true">✈</span><div><h1>${tx(L.title)}</h1><p class="lead">${tx(L.sub)}</p></div></div><nav class="tabs">${[["recap","t1"],["game","t2"],["quiz","t3"],["res","t4"]].map(([k,n])=>`<button class="tb${tab===k?" on":""}" data-t="${k}">${t(n)}</button>`).join("")}</nav><section id="pane" style="--t:${L.color}"></section>`;
 const p=$("#pane");
 if(tab==="recap")p.innerHTML=`<ul class="rc">${L.recap.map(r=>`<li class="st"><h3>${tx(r[0])}</h3><p>${tx(r[1])}</p></li>`).join("")}</ul><p><button class="btn" data-t="game">${t("go")}</button></p>`;
 else if(tab==="res")p.innerHTML=`<ul class="links">${L.links.map(([n,u])=>`<li><a class="st" href="${u}" target="_blank" rel="noopener">${tx(n)} ↗</a></li>`).join("")}</ul>`;
 else{const g=tab==="game";
  p.innerHTML=(g?`<div class="lvs">${L.games.map((x,i)=>`<button class="lv${i===lv?" on":""}" data-lv="${i}">${P[L.id+":g"+i]?"✓ ":""}${t("lvl",i+1)}</button>`).join("")}</div>`:"")+`<div id="stage" class="st"></div>`;
  const d=g?L.games[lv]:{kind:"choose",title:t("quizT"),qs:L.quiz};
  E[d.kind](d,L.id+(g?":g"+lv:":q"),$("#stage"))}}
function aboutView(){cur=null;
 app.innerHTML=`<a class="back" href="#">${t("back")}</a><h1>${t("abh")}</h1><p class="lead">${t("abp")}</p><h2>${t("addh")}</h2><p>${t("addp")}</p>
<pre class="st">{ id:"lesson-02", n:"2", color:"#0e9aa7",
  title:["Title","标题","Titre"], sub:"…",
  recap:[[["Point","要点","Point"],["Text","说明","Texte"]]],
  games:[{kind:"order", title:[…], steps:[[…],[…]]}],
  quiz:[{q:[…], o:[[…],[…]], a:0, w:[…]}],
  links:[[["Name","名称","Nom"],"https://example.com"]] }</pre>`}
function view(){const h=location.hash.slice(1),L=LESSONS.find(l=>l.id===h);L?lessonView(L):h==="about"?aboutView():homeView()}
function route(){view();scrollTo(0,0)}
app.onclick=e=>{const b=e.target.closest("[data-t],[data-lv],[data-again],[data-next]");if(!b||!cur)return;
 if(b.dataset.t)tab=b.dataset.t;
 if(b.dataset.lv)lv=+b.dataset.lv;
 if("next" in b.dataset){if(tab==="game"&&lv<cur.games.length-1)lv++;else if(tab==="game")tab="quiz";else{location.hash="";return}}
 lessonView(cur)};
document.addEventListener("change",e=>{if(e.target.id==="lg"){lang=e.target.value;try{localStorage.setItem("lpl",lang)}catch(_){}hdr();view()}});
addEventListener("hashchange",()=>{tab="recap";lv=0;route()});
hdr();route();
</script>
</body>
</html>
